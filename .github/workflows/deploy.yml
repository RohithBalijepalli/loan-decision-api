name: Loan Decision API — CI/CD

on:
  push:
    branches:
      - main        # deploys to prod
      - develop     # deploys to dev
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write   # required for OIDC auth with AWS
  contents: read
  pull-requests: write  # allows posting plan output as PR comment

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.0
  PYTHON_VERSION: "3.12"

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Lint and test Python Lambda code
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Test Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov boto3 moto

      - name: Run unit tests
        run: |
          cd src
          pytest tests/ -v --cov=lambda --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/coverage.xml

  # ─────────────────────────────────────────────
  # JOB 2: Terraform validate + lint
  # ─────────────────────────────────────────────
  terraform-lint:
    name: 🔍 Terraform Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: |
          cd terraform
          terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (no backend)
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec (security scan)
        run: |
          tfsec terraform/ --format lovely --minimum-severity MEDIUM
        continue-on-error: true  # warns but doesn't block for now

  # ─────────────────────────────────────────────
  # JOB 3: Terraform Plan (on PRs)
  # ─────────────────────────────────────────────
  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: [test, terraform-lint]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=loan-decision-api/${{ steps.env.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Plan
        id: plan
        run: |
          cd terraform
          terraform plan \
            -var="environment=${{ steps.env.outputs.environment }}" \
            -var="owner=rohit" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const maxLength = 65000;
            const truncated = plan.length > maxLength
              ? plan.substring(0, maxLength) + '\n\n... (truncated)'
              : plan;

            const body = `## 🏗️ Terraform Plan — \`${{ steps.env.outputs.environment }}\`

            <details>
            <summary>Click to expand plan output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>

            **Plan status:** ${{ steps.plan.outcome == 'success' && '✅ Success' || '❌ Failed' }}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ─────────────────────────────────────────────
  # JOB 4: Deploy to Dev (on push to develop)
  # ─────────────────────────────────────────────
  deploy-dev:
    name: 🚀 Deploy → Dev
    runs-on: ubuntu-latest
    needs: [test, terraform-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=loan-decision-api/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply \
            -var="environment=dev" \
            -var="owner=rohit" \
            -auto-approve

      - name: Export outputs
        id: tf_outputs
        run: |
          cd terraform
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT

      - name: Smoke test — dev
        run: |
          echo "Testing endpoint: ${{ steps.tf_outputs.outputs.api_endpoint }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ steps.tf_outputs.outputs.api_endpoint }}/loan/evaluate" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.API_KEY_DEV }}" \
            -d '{
              "applicant": {
                "name": "Smoke Test",
                "annual_income": 80000,
                "monthly_debt": 500,
                "employment_years": 3,
                "credit_history": "Clean"
              },
              "loan": { "amount": 10000, "term_months": 36, "purpose": "Test" }
            }')
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Smoke test failed with status $STATUS"
            exit 1
          fi
          echo "✅ Smoke test passed"

  # ─────────────────────────────────────────────
  # JOB 5: Deploy to Prod (on push to main)
  # ─────────────────────────────────────────────
  deploy-prod:
    name: 🚀 Deploy → Prod
    runs-on: ubuntu-latest
    needs: [test, terraform-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod   # requires manual approval in GitHub (configure in repo settings)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_PROD }}" \
            -backend-config="key=loan-decision-api/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE_PROD }}"

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
            -var="environment=prod" \
            -var="owner=rohit" \
            -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply tfplan

      - name: Tag release
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a "v$(date +'%Y%m%d%H%M%S')" -m "Prod deploy from ${{ github.sha }}"
          git push origin --tags
